<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PédiaUrg PRO - Toulouse EME</title>
    <style>
        :root {
            --primary: #1a237e; --accent: #0288d1; --danger: #d32f2f;
            --bg: #f4f7f6; --card-bg: #ffffff;
            --cat-acr: #000; --cat-neuro: #2196f3; --cat-perf: #607d8b;
            --exception-bg: #fff3e0; --exception-border: #ff9800;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; color: #333; -webkit-tap-highlight-color: transparent; }

        /* HEADER */
        .header-container {
            background: var(--primary); color: white; padding: 15px;
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .input-group { background: rgba(255, 255, 255, 0.15); padding: 8px; border-radius: 12px; text-align: center; }
        .input-group label { display: block; font-size: 0.6rem; font-weight: bold; color: #e1f5fe; }
        .input-group input { background: transparent; border: none; color: white; font-size: 1.2rem; font-weight: bold; width: 100%; text-align: center; outline: none; }
        .weight-display-card { background: white; border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: space-between; color: var(--primary); }
        .weight-actual { font-size: 1.5rem; font-weight: 900; color: var(--accent); }
        .btn-clear { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }

        /* TABS */
        .tabs-wrapper { padding: 15px 0 5px 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-btn { display: inline-block; padding: 10px 18px; margin-right: 8px; border-radius: 20px; background: #e0e0e0; color: #666; font-size: 0.8rem; font-weight: bold; border: none; }
        .tab-btn.active { background: var(--accent); color: white; }

        /* ARBRE NEURO */
        .neuro-tree { padding: 10px 15px; }
        .timeline-step { border-left: 3px dashed #2196f3; margin-left: 8px; padding-left: 15px; position: relative; margin-bottom: 20px; }
        .timeline-step::before { content: ''; position: absolute; left: -10px; top: 0; width: 16px; height: 16px; background: var(--cat-neuro); border-radius: 50%; }
        .step-title { font-weight: 900; font-size: 0.75rem; color: var(--cat-neuro); text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        .vvp-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vvp-label { font-size: 0.6rem; font-weight: bold; text-align: center; background: #eee; border-radius: 4px; padding: 3px; margin-bottom: 5px; }

        /* EXCEPTIONS */
        .exception-box { 
            background: var(--exception-bg); border-left: 5px solid var(--exception-border); 
            padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.8rem; 
        }
        .exception-title { font-weight: bold; color: #e65100; text-transform: uppercase; font-size: 0.7rem; margin-bottom: 5px; }

        /* CARTES MÉDOCS */
        .med-card { background: white; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 6px solid #ddd; overflow: hidden; cursor: pointer; }
        .med-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .med-name { font-weight: bold; font-size: 0.85rem; text-transform: uppercase; }
        .res-main { font-size: 1.3rem; font-weight: 900; color: var(--danger); text-align: right; }
        .res-sub { font-size: 0.7rem; font-weight: bold; color: #555; text-align: right; }

        /* STYLE BUCCOLAM COULEURS */
        .bucco-tag { padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; color: white; display: inline-block; margin-top: 3px; }
        .bg-yellow { background: #fbc02d; color: black; }
        .bg-blue { background: #1976d2; }
        .bg-purple { background: #7b1fa2; }
        .bg-orange { background: #f57c00; }

        .med-details { max-height: 0; padding: 0 12px; background: #fafafa; opacity: 0; transition: 0.3s; }
        .med-card.open .med-details { max-height: 500px; padding: 12px; opacity: 1; border-top: 1px solid #eee; }
        .detail-row { margin-bottom: 8px; font-size: 0.8rem; }
        .detail-label { font-size: 0.6rem; font-weight: bold; color: var(--accent); text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header-container">
    <div class="input-grid">
        <div class="input-group" style="grid-column: span 2;"><label>POIDS RÉEL (KG)</label><input type="number" id="manualWeight" placeholder="--" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (ANS)</label><input type="number" id="ageYears" placeholder="0" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (MOIS)</label><input type="number" id="ageMonths" placeholder="0" oninput="processInput()"></div>
    </div>
    <div class="weight-display-card">
        <div id="weightMsg" style="font-size:0.7rem; font-weight:bold">DONNÉES...</div>
        <div id="weightValDisplay" class="weight-actual"></div>
        <button class="btn-clear" onclick="clearAll()">C</button>
    </div>
</div>

<div class="tabs-wrapper">
    <button class="tab-btn active" onclick="setFilter('all', this)">Tous</button>
    <button class="tab-btn" onclick="setFilter('neuro', this)">Neurologie (Arbre)</button>
    <button class="tab-btn" onclick="setFilter('acr', this)">ACR</button>
    <button class="tab-btn" onclick="setFilter('perf', this)">Perfusions</button>
</div>

<div id="medList"></div>

<script>
    const medications = [
        { id: "valium_ir", name: "Diazépam (Valium) IR", cat: "neuro", dose: 0.5, conc: 5, unit: "mg/kg", type: "ml", max: 10, ampoule: "10mg/2ml", dilution: "Pur", debit: "Intra-Rectal" },
        { id: "buccolam", name: "Buccolam (IB)", cat: "neuro", type: "buccolam" },
        { id: "rivotril", name: "Clonazépam (Rivotril)", cat: "neuro", dose: 0.05, conc: 1, unit: "mg/kg", type: "ml", max: 1, ampoule: "1mg/1ml", dilution: "1ml+1ml solvant", debit: "IVL 5-10 min" },
        { id: "keppra", name: "Lévétiracétam (Keppra)", cat: "neuro", dose: 40, conc: 100, unit: "mg/kg", type: "ml", max: 3000, ampoule: "100mg/ml", dilution: "NaCl 0.9%", debit: "IVL 5 min" },
        { id: "dilantin", name: "Phénytoïne (Dilantin)", cat: "neuro", dose: 20, conc: 50, unit: "mg/kg", type: "ml", max: 1000, ampoule: "50mg/ml", dilution: "NaCl 0.9% obligatoire", debit: "IVL 20 min" },
        { id: "gardenal", name: "Phénobarbital (Gardénal)", cat: "neuro", dose: 20, conc: 40, unit: "mg/kg", type: "ml", max: 600, ampoule: "40mg/ml", dilution: "Pur ou NaCl", debit: "IVL 20 min" },
        { name: "Adrénaline (ACR)", cat: "acr", dose: 10, conc: 100, unit: "mcg/kg", type: "ml", ampoule: "1mg/1ml", dilution: "1mg/10ml", debit: "IVD Flash" }
    ];

    let currentFilter = 'all';
    let activeWeight = 0;
    let isInfant = false;

    function processInput() {
        const w = parseFloat(document.getElementById('manualWeight').value);
        const y = parseFloat(document.getElementById('ageYears').value) || 0;
        const m = parseFloat(document.getElementById('ageMonths').value) || 0;
        const msg = document.getElementById('weightMsg');
        const disp = document.getElementById('weightValDisplay');

        isInfant = (y === 0 && m < 3 && m > 0);

        if (w > 0) { activeWeight = w; msg.innerText = "POIDS RÉEL :"; disp.innerText = w + " kg"; }
        else if (y >= 1) { activeWeight = (y + 4) * 2; msg.innerText = "POIDS ESTIMÉ :"; disp.innerText = activeWeight + " kg"; }
        else { activeWeight = 0; msg.innerText = "DONNÉES..."; disp.innerText = ""; }
        render();
    }

    function clearAll() { document.getElementById('manualWeight').value = ''; document.getElementById('ageYears').value = ''; document.getElementById('ageMonths').value = ''; processInput(); }
    function setFilter(cat, btn) { currentFilter = cat; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }

    function getBuccolamData(w) {
        if (w < 5) return { dose: "?", color: "Gris", class: "", label: "Poids trop faible" };
        if (w < 10) return { dose: "2.5 mg", color: "Jaune", class: "bg-yellow", label: "Seringue JAUNE" };
        if (w < 20) return { dose: "5 mg", color: "Bleu", class: "bg-blue", label: "Seringue BLEUE" };
        if (w < 30) return { dose: "7.5 mg", color: "Violet", class: "bg-purple", label: "Seringue VIOLETTE" };
        return { dose: "10 mg", color: "Orange", class: "bg-orange", label: "Seringue ORANGE" };
    }

    function getCardHtml(m) {
        if (m.type === "buccolam") {
            const data = getBuccolamData(activeWeight);
            return `
                <div class="med-card cat-neuro" onclick="this.classList.toggle('open')">
                    <div class="med-header">
                        <div><div class="med-name">${m.name}</div><div class="bucco-tag ${data.class}">${data.label}</div></div>
                        <div class="res-container"><span class="res-main">${data.dose}</span><span class="res-sub">Dose fixe</span></div>
                    </div>
                    <div class="med-details"><div class="detail-row"><div class="detail-label">Protocole</div><div class="detail-text">Administration intra-buccale. Ne pas injecter.</div></div></div>
                </div>`;
        }

        let val = activeWeight * m.dose;
        if (m.max && val > m.max) val = m.max;
        const ml = (val / m.conc).toFixed(2);
        
        return `
            <div class="med-card cat-${m.cat}" onclick="this.classList.toggle('open')">
                <div class="med-header">
                    <div><div class="med-name">${m.name}</div><div style="font-size:0.6rem; color:#666">${m.dose} ${m.unit}</div></div>
                    <div class="res-container"><span class="res-main">${ml} ml</span><span class="res-sub">${val.toFixed(1)} ${m.unit.split('/')[0]}</span></div>
                </div>
                <div class="med-details">
                    <div class="detail-row"><div class="detail-label">Ampoule</div><div class="detail-text">${m.ampoule || "-"}</div></div>
                    <div class="detail-row"><div class="detail-label">Dilution</div><div class="detail-text">${m.dilution || "-"}</div></div>
                    <div class="detail-row"><div class="detail-label">Injection</div><div class="detail-text">${m.debit || "-"}</div></div>
                </div>
            </div>`;
    }

    function render() {
        const container = document.getElementById('medList');
        container.innerHTML = '';
        if (activeWeight <= 0) return;

        if (currentFilter === 'neuro') {
            let html = `
                <div class="exception-box">
                    <div class="exception-title">⚠️ Exceptions / Précautions</div>
                    • <b>Régime cétogène :</b> Pas de soluté glucosé (G5%).<br>
                    • <b>Nourrisson < 3 mois :</b> Gardénal 20mg/kg en 1ère intention.<br>
                    • <b>Épilepsie connue :</b> Priorité au protocole personnalisé si présent.
                </div>`;
            
            if (isInfant) {
                html += `<div class="timeline-step" style="border-color:var(--danger)">
                            <span class="step-title" style="color:var(--danger)">Cas particulier : Nourrisson < 3 mois</span>
                            ${getCardHtml(medications.find(m => m.id === 'gardenal'))}
                         </div>`;
            }

            html += `
                <div class="timeline-step"><span class="step-title">T1 (0-5 min) - Benzo n°1</span>
                    ${getCardHtml(medications.find(m => m.id === 'valium_ir'))}
                    ${getCardHtml(medications.find(m => m.id === 'buccolam'))}
                </div>
                <div class="timeline-step"><span class="step-title">T2 (10 min) - Benzo n°2</span>
                    <div class="vvp-split">
                        <div><div class="vvp-label">PAS DE VVP</div>${getCardHtml(medications.find(m => m.id === 'valium_ir'))}</div>
                        <div><div class="vvp-label">VVP</div>${getCardHtml(medications.find(m => m.id === 'rivotril'))}</div>
                    </div>
                </div>
                <div class="timeline-step"><span class="step-title">T3 (20-25 min)</span>${getCardHtml(medications.find(m => m.id === 'keppra'))}</div>
                <div class="timeline-step"><span class="step-title">T4 (35 min)</span>${getCardHtml(medications.find(m => m.id === 'dilantin'))}</div>
                <div class="timeline-step"><span class="step-title">T5 (55 min)</span>${getCardHtml(medications.find(m => m.id === 'gardenal'))}</div>`;
            
            container.innerHTML = html;
        } else {
            medications.filter(m => currentFilter === 'all' || m.cat === currentFilter).forEach(m => {
                container.innerHTML += getCardHtml(m);
            });
        }
    }
</script>
</body>
</html>
