<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PédiaUrg PRO - Toulouse v5</title>
    <style>
        :root {
            --primary: #1a237e; --accent: #0288d1; --danger: #d32f2f;
            --bg: #f4f7f6; --card-bg: #ffffff;
            --cat-acr: #000; --cat-neuro: #2196f3; --cat-perf: #607d8b;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; color: #333; -webkit-tap-highlight-color: transparent; }

        /* HEADER */
        .header-container {
            background: var(--primary); color: white; padding: 15px;
            border-radius: 0 0 25px 25px; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .input-group { background: rgba(255, 255, 255, 0.15); padding: 8px; border-radius: 12px; text-align: center; }
        .input-group label { display: block; font-size: 0.6rem; font-weight: bold; color: #e1f5fe; }
        .input-group input { background: transparent; border: none; color: white; font-size: 1.2rem; font-weight: bold; width: 100%; text-align: center; outline: none; }
        .weight-display-card { background: white; border-radius: 15px; padding: 10px; display: flex; align-items: center; justify-content: space-between; color: var(--primary); }
        .weight-actual { font-size: 1.5rem; font-weight: 900; color: var(--accent); }
        .btn-clear { background: var(--danger); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: bold; }

        /* TABS */
        .tabs-wrapper { padding: 15px 0 5px 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab-btn { display: inline-block; padding: 10px 18px; margin-right: 8px; border-radius: 20px; background: #e0e0e0; color: #666; font-size: 0.8rem; font-weight: bold; border: none; }
        .tab-btn.active { background: var(--accent); color: white; }

        /* STRUCTURE ARBRE NEURO */
        .timeline-step { border-left: 3px dashed #2196f3; margin-left: 10px; padding-left: 10px; position: relative; margin-bottom: 25px; }
        .timeline-step::before { content: ''; position: absolute; left: -10px; top: 0; width: 16px; height: 16px; background: var(--cat-neuro); border-radius: 50%; }
        .step-title { font-weight: 900; font-size: 0.75rem; color: var(--cat-neuro); text-transform: uppercase; margin-bottom: 5px; display: block; }
        
        /* GRILLE DE CHOIX */
        .choice-grid { display: flex; align-items: flex-start; gap: 5px; width: 100%; }
        .choice-col { flex: 1; min-width: 0; }
        .or-divider { display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 900; color: #999; padding: 0 2px; height: 50px; text-transform: uppercase; }
        .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: #ddd; margin: 0 2px; }

        /* CARTES MÉDOCS */
        #medList { padding: 10px 15px; }
        .med-card { background: white; border-radius: 10px; margin-bottom: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); border-left: 4px solid #ddd; overflow: hidden; cursor: pointer; }
        .med-header { padding: 8px; display: flex; justify-content: space-between; align-items: center; flex-direction: column; text-align: center; }
        .med-name { font-weight: 800; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 4px; line-height: 1; }
        .res-main { font-size: 1.1rem; font-weight: 900; color: var(--danger); display: block; }
        .res-sub { font-size: 0.6rem; font-weight: bold; color: #555; }

        .med-details { max-height: 0; padding: 0 8px; background: #fafafa; opacity: 0; transition: all 0.3s ease; font-size: 0.7rem; }
        .med-card.open .med-details { max-height: 400px; padding: 8px; opacity: 1; border-top: 1px solid #eee; }
        .detail-row { margin-bottom: 4px; }
        .detail-label { font-weight: bold; color: var(--accent); text-transform: uppercase; font-size: 0.55rem; }

        /* BUCCOLAM COLORS */
        .bucco-tag { padding: 1px 4px; border-radius: 3px; font-size: 0.55rem; font-weight: bold; color: white; display: inline-block; margin-top: 2px; }
        .bg-yellow { background: #fbc02d; color: black; } .bg-blue { background: #1976d2; } .bg-purple { background: #7b1fa2; } .bg-orange { background: #f57c00; }

        .cat-neuro { border-left-color: var(--cat-neuro); }
        .cat-acr { border-left-color: var(--cat-acr); }
        .cat-perf { border-left-color: var(--cat-perf); }
    </style>
</head>
<body>

<div class="header-container">
    <div class="input-grid">
        <div class="input-group" style="grid-column: span 2;"><label>POIDS RÉEL (KG)</label><input type="number" id="manualWeight" placeholder="--" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (ANS)</label><input type="number" id="ageYears" placeholder="0" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (MOIS)</label><input type="number" id="ageMonths" placeholder="0" oninput="processInput()"></div>
    </div>
    <div class="weight-display-card">
        <div id="weightMsg" style="font-size:0.65rem; font-weight:bold">DONNÉES...</div>
        <div id="weightValDisplay" class="weight-actual"></div>
        <button class="btn-clear" onclick="clearAll()">C</button>
    </div>
</div>

<div class="tabs-wrapper">
    <button class="tab-btn active" onclick="setFilter('neuro', this)">Neurologie (Arbre)</button>
    <button class="tab-btn" onclick="setFilter('acr', this)">ACR</button>
    <button class="tab-btn" onclick="setFilter('all', this)">Tous</button>
    <button class="tab-btn" onclick="setFilter('perf', this)">Perfusions</button>
</div>

<div id="medList"></div>

<script>
    const medications = [
        { id: "valium_ir", name: "Valium IR", cat: "neuro", dose: 0.5, conc: 5, unit: "mg/kg", type: "ml", max: 10, ampoule: "10mg/2ml", dilution: "Pur", debit: "Intra-Rectal" },
        { id: "buccolam", name: "Buccolam", cat: "neuro", type: "buccolam" },
        { id: "mida_in", name: "Midazolam IN", cat: "neuro", dose: 0.2, conc: 5, unit: "mg/kg", type: "ml", max: 10, ampoule: "5mg/ml", dilution: "Pur", debit: "Intranasal" },
        { id: "rivotril", name: "Rivotril IV", cat: "neuro", dose: 0.05, conc: 1, unit: "mg/kg", type: "ml", max: 1, ampoule: "1mg/ml", dilution: "1+1 solvant", debit: "IVL 5-10 min" },
        { id: "keppra", name: "Keppra", cat: "neuro", dose: 40, conc: 100, unit: "mg/kg", type: "ml", max: 3000, ampoule: "100mg/ml", dilution: "NaCl 0.9%", debit: "IVL 5 min" },
        { id: "dilantin", name: "Dilantin", cat: "neuro", dose: 20, conc: 50, unit: "mg/kg", type: "ml", max: 1000, ampoule: "50mg/ml", dilution: "NaCl 0.9%", debit: "IVL 20 min" },
        { id: "gardenal", name: "Gardénal", cat: "neuro", dose: 20, conc: 40, unit: "mg/kg", type: "ml", max: 600, ampoule: "40mg/ml", dilution: "NaCl", debit: "IVL 20 min" },
        { name: "Adrénaline (ACR)", cat: "acr", dose: 10, conc: 100, unit: "mcg/kg", type: "ml", ampoule: "1mg/ml", dilution: "1mg/10ml", debit: "IVD Flash" }
    ];

    let currentFilter = 'neuro';
    let activeWeight = 0;

    function processInput() {
        const w = parseFloat(document.getElementById('manualWeight').value);
        const y = parseFloat(document.getElementById('ageYears').value) || 0;
        const m = parseFloat(document.getElementById('ageMonths').value) || 0;
        if (w > 0) activeWeight = w;
        else if (y >= 1) activeWeight = (y + 4) * 2;
        else activeWeight = 0;
        document.getElementById('weightValDisplay').innerText = activeWeight > 0 ? activeWeight + " kg" : "";
        render();
    }

    function clearAll() { document.querySelectorAll('input').forEach(i => i.value = ''); processInput(); }
    function setFilter(cat, btn) { currentFilter = cat; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }

    function getBuccolamData(w) {
        if (w < 10) return { dose: "2.5mg", class: "bg-yellow", label: "JAUNE" };
        if (w < 20) return { dose: "5mg", class: "bg-blue", label: "BLEUE" };
        if (w < 30) return { dose: "7.5mg", class: "bg-purple", label: "VIOLET" };
        return { dose: "10mg", class: "bg-orange", label: "ORANGE" };
    }

    function getCardHtml(id) {
        const m = medications.find(x => x.id === id);
        if (!m) return "";
        let resMain = "", resSub = "";
        
        if (m.type === "buccolam") {
            const d = getBuccolamData(activeWeight);
            resMain = d.dose; resSub = "Fixe";
            return `<div class="med-card cat-neuro" onclick="this.classList.toggle('open')">
                <div class="med-header">
                    <div class="med-name">${m.name}<br><span class="bucco-tag ${d.class}">${d.label}</span></div>
                    <div class="res-container"><span class="res-main">${resMain}</span><span class="res-sub">${resSub}</span></div>
                </div>
                <div class="med-details">IB uniquement</div>
            </div>`;
        }

        let val = activeWeight * m.dose;
        if (m.max && val > m.max) val = m.max;
        resMain = (val / m.conc).toFixed(2) + " ml";
        resSub = val.toFixed(1) + " mg";

        return `<div class="med-card cat-${m.cat}" onclick="this.classList.toggle('open')">
            <div class="med-header">
                <div class="med-name">${m.name}</div>
                <div class="res-container"><span class="res-main">${resMain}</span><span class="res-sub">${resSub}</span></div>
            </div>
            <div class="med-details">
                <div class="detail-row"><span class="detail-label">Injection:</span> ${m.debit}</div>
                <div class="detail-row"><span class="detail-label">Dilution:</span> ${m.dilution}</div>
            </div>
        </div>`;
    }

    function render() {
        const container = document.getElementById('medList');
        container.innerHTML = '';
        if (activeWeight <= 0) return;

        if (currentFilter === 'neuro') {
            container.innerHTML = `
                <div class="timeline-step">
                    <span class="step-title">T1 (0-5 min) - Choisir 1 seul</span>
                    <div class="choice-grid">
                        <div class="choice-col">${getCardHtml('valium_ir')}</div>
                        <div class="or-divider">OU</div>
                        <div class="choice-col">${getCardHtml('buccolam')}</div>
                        <div class="or-divider">OU</div>
                        <div class="choice-col">${getCardHtml('mida_in')}</div>
                    </div>
                </div>
                <div class="timeline-step">
                    <span class="step-title">T2 (10 min) - Choisir 1 seul</span>
                    <div class="choice-grid">
                        <div class="choice-col"><div class="vvp-label">PAS DE VVP</div>${getCardHtml('valium_ir')}</div>
                        <div class="or-divider">OU</div>
                        <div class="choice-col"><div class="vvp-label">VVP</div>${getCardHtml('rivotril')}</div>
                    </div>
                </div>
                <div class="timeline-step"><span class="step-title">T3 (25 min)</span>${getCardHtml('keppra')}</div>
                <div class="timeline-step"><span class="step-title">T4 (35 min)</span>${getCardHtml('dilantin')}</div>
                <div class="timeline-step"><span class="step-title">T5 (55 min)</span>${getCardHtml('gardenal')}</div>`;
        } else {
            medications.filter(m => currentFilter === 'all' || m.cat === currentFilter).forEach(m => {
                container.innerHTML += getCardHtml(m.id);
            });
        }
    }
</script>
</body>
</html>
