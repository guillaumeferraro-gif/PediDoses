<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PédiaUrg PRO - Expert</title>
    <style>
        :root {
            --primary: #1a237e; --accent: #0288d1; --danger: #d32f2f;
            --bg: #f4f7f6; --card-bg: #ffffff;
            --cat-acr: #000000; --cat-antibio: #4caf50; --cat-cardio: #9c27b0;
            --cat-sedation: #ff9800; --cat-neuro: #2196f3; --cat-antidote: #009688;
            --cat-traumato: #795548; --cat-perf: #607d8b;
        }

        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; color: #333; }

        /* HEADER & INPUTS */
        .header-container {
            background: var(--primary); color: white; padding: 15px;
            border-radius: 0 0 20px 20px; position: sticky; top: 0; z-index: 100;
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
        .input-group { background: rgba(255, 255, 255, 0.1); padding: 8px; border-radius: 10px; text-align: center; }
        .input-group label { display: block; font-size: 0.6rem; font-weight: bold; color: #cfd8dc; }
        .input-group input { background: transparent; border: none; color: white; font-size: 1.2rem; font-weight: bold; width: 100%; text-align: center; outline: none; }
        
        .weight-box { background: white; color: var(--primary); border-radius: 12px; padding: 10px; display: flex; align-items: center; justify-content: space-between; }
        .weight-value { font-size: 1.5rem; font-weight: 900; color: var(--accent); }
        .btn-clear { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; }

        /* TABS (SCROLL HORIZONTAL) */
        .tabs-wrapper { padding: 10px 0 5px 15px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        .tab-btn { display: inline-block; padding: 8px 15px; margin-right: 5px; border-radius: 15px; background: #e0e0e0; font-size: 0.8rem; font-weight: bold; border: none; }
        .tab-btn.active { background: var(--accent); color: white; }

        /* LISTE DES CARTES */
        #medList { padding: 10px; }
        .med-card {
            background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 6px solid #ddd;
            cursor: pointer;
        }
        .res-main { font-size: 1.4rem; font-weight: 900; color: var(--danger); display: block; text-align: right; }
        .res-sub { font-size: 0.8rem; font-weight: bold; color: #555; text-align: right; }

        /* MODALE (PROTOCOLE) */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 85%; max-height: 80vh; overflow-y: auto; border-radius: 20px; position: relative; }
        .modal-header { border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .modal-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; color: var(--primary); }
        
        .proto-row { margin-bottom: 15px; padding: 10px; background: #f9f9f9; border-radius: 10px; }
        .proto-label { font-size: 0.7rem; font-weight: bold; color: var(--accent); text-transform: uppercase; margin-bottom: 4px; }
        .proto-value { font-size: 0.95rem; color: #333; line-height: 1.4; }
        .proto-important { background: #fff3e0; border-left: 4px solid var(--warning); padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; color: var(--danger); }

        .close-modal { background: var(--primary); color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-weight: bold; margin-top: 10px; }

        /* Couleurs Catégories */
        .cat-acr { border-left-color: var(--cat-acr); }
        .cat-antibio { border-left-color: var(--cat-antibio); }
        .cat-cardio { border-left-color: var(--cat-cardio); }
        .cat-sedation { border-left-color: var(--cat-sedation); }
        .cat-neuro { border-left-color: var(--cat-neuro); }
        .cat-antidote { border-left-color: var(--cat-antidote); }
        .cat-traumato { border-left-color: var(--cat-traumato); }
        .cat-perf { border-left-color: var(--cat-perf); }
    </style>
</head>
<body>

<div class="header-container">
    <div style="text-align:center; font-size:0.7rem; letter-spacing:1px; opacity:0.8">PÉDIAURG EXPERT</div>
    <div class="input-grid">
        <div class="input-group" style="grid-column: span 2;"><label>POIDS (KG)</label><input type="number" id="manualWeight" placeholder="--" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (ANS)</label><input type="number" id="ageYears" placeholder="0" oninput="processInput()"></div>
        <div class="input-group"><label>ÂGE (MOIS)</label><input type="number" id="ageMonths" placeholder="0" oninput="processInput()"></div>
    </div>
    <div class="weight-box">
        <div id="weightMsg" style="font-size:0.7rem; font-weight:bold">EN ATTENTE...</div>
        <button class="btn-clear" onclick="clearAll()">C</button>
    </div>
</div>

<div class="tabs-wrapper">
    <button class="tab-btn active" onclick="setFilter('all', this)">Tous</button>
    <button class="tab-btn" onclick="setFilter('acr', this)">ACR</button>
    <button class="tab-btn" onclick="setFilter('antibio', this)">Antibio</button>
    <button class="tab-btn" onclick="setFilter('cardio', this)">Cardio</button>
    <button class="tab-btn" onclick="setFilter('sedation', this)">Sédation</button>
    <button class="tab-btn" onclick="setFilter('neuro', this)">Neuro</button>
    <button class="tab-btn" onclick="setFilter('antidote', this)">Antidotes</button>
    <button class="tab-btn" onclick="setFilter('traumato', this)">Traumato</button>
    <button class="tab-btn" onclick="setFilter('perf', this)">Perfusion</button>
</div>

<div id="medList"></div>

<!-- MODALE PROTOCOLE -->
<div id="protoModal" class="modal">
    <div class="modal-content">
        <div class="modal-header"><div id="modalTitle" class="modal-title">-</div></div>
        
        <div id="calcFlowArea" class="proto-important" style="display:none;">
            DÉBIT CALCULÉ : <span id="protoCalcFlow">0</span> ml/h
        </div>

        <div class="proto-row"><div class="proto-label">Concentration de l'ampoule</div><div id="protoAmpoule" class="proto-value">-</div></div>
        <div class="proto-row"><div class="proto-label">Méthode de dilution</div><div id="protoDilution" class="proto-value">-</div></div>
        <div class="proto-row"><div class="proto-label">Débit / Administration</div><div id="protoDebit" class="proto-value">-</div></div>
        <div class="proto-row"><div class="proto-label">Posologie de référence</div><div id="protoInfos" class="proto-value">-</div></div>

        <button class="close-modal" onclick="closeModal()">RETOUR</button>
    </div>
</div>

<script>
    // BASE DE DONNÉES
    // unit: mg/kg pour bolus, µg/kg/min ou µg/kg/h pour perf
    const medications = [
        // EXEMPLE ACR
        { 
            name: "Adrénaline (Bolus)", cat: "acr", dose: 0.01, conc: 0.1, unit: "mg/kg", type: "ml",
            ampoule: "1 mg / 1 mL",
            dilution: "1 mL Adrénaline + 9 mL NaCl 0.9% = 0.1 mg/mL",
            debit: "Bolus flash", infos: "0.1 mL/kg de la solution diluée"
        },
        // EXEMPLE PERFUSION CONTINUE
        { 
            name: "Adrénaline (Perf)", cat: "perf", dose: 0.1, conc: 0.1, unit: "µg/kg/min", type: "perf_min",
            ampoule: "1 mg / 1 mL",
            dilution: "5 mg (5 mL) complétés à 50 mL de G5% ou NaCl (Conc: 0.1 mg/mL)",
            debit: "Débit initial 0.1 µg/kg/min. Titrer par paliers de 0.05.",
            infos: "Surveillance scope, PA, FC. Voie centrale préférée."
        },
        { 
            name: "Noradrénaline (Perf)", cat: "perf", dose: 0.1, conc: 0.1, unit: "µg/kg/min", type: "perf_min",
            ampoule: "8 mg / 4 mL",
            dilution: "Diluer pour obtenir 0.1 mg/mL dans 50 mL.",
            debit: "Débit selon la cible de PAM.",
            infos: "Exclusivité Voie Centrale ou Intra-osseux."
        },
        { 
            name: "Sufentanil (Perf)", cat: "perf", dose: 0.2, conc: 0.005, unit: "µg/kg/h", type: "perf_h",
            ampoule: "250 µg / 5 mL",
            dilution: "Prendre 50 µg (1 mL) et compléter à 50 mL (Conc: 1 µg/mL ou 0.001 mg/mL).",
            debit: "Entretien sédation réanimation.",
            infos: "Attention dépression respiratoire."
        }
        // ... (Insérer ici toutes les autres molécules sur le même format)
    ];

    let currentFilter = 'all';
    let activeWeight = 0;

    function processInput() {
        const w = parseFloat(document.getElementById('manualWeight').value);
        const y = parseFloat(document.getElementById('ageYears').value) || 0;
        const m = parseFloat(document.getElementById('ageMonths').value) || 0;
        const msg = document.getElementById('weightMsg');

        if (w > 0) { activeWeight = w; msg.innerHTML = `POIDS : <span class="weight-value">${w} kg</span>`; }
        else if (y >= 1 || (y + m/12) >= 1) {
            activeWeight = (y + (m/12) + 4) * 2;
            msg.innerHTML = `ESTIMÉ : <span class="weight-value">${activeWeight.toFixed(1)} kg</span>`;
        } else { activeWeight = 0; msg.innerHTML = "DONNÉES..."; }
        render();
    }

    function clearAll() {
        document.getElementById('manualWeight').value = ''; document.getElementById('ageYears').value = ''; document.getElementById('ageMonths').value = '';
        processInput();
    }

    function setFilter(cat, btn) {
        currentFilter = cat;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function calculateResult(m) {
        if (activeWeight <= 0) return { main: "-", sub: "-" };
        let resMain = "", resSub = "";

        if (m.type === "ml") {
            const mg = activeWeight * m.dose;
            resMain = `${(mg / m.conc).toFixed(2)} ml`;
            resSub = `${mg.toFixed(2)} mg`;
        } else if (m.type === "perf_min") {
            // ml/h = (mcg/kg/min * poids * 60) / (conc en mcg/ml)
            const mlh = (m.dose * activeWeight * 60) / (m.conc * 1000);
            resMain = `${mlh.toFixed(1)} ml/h`;
            resSub = `${m.dose} µg/kg/min`;
        } else if (m.type === "perf_h") {
            const mlh = (m.dose * activeWeight) / (m.conc * 1000);
            resMain = `${mlh.toFixed(1)} ml/h`;
            resSub = `${m.dose} µg/kg/h`;
        } else if (m.type === "joules") {
            resMain = `${Math.round(activeWeight * m.dose)} J`;
            resSub = "Choc";
        } else if (m.type === "direct_ml") {
            resMain = `${(activeWeight * m.dose).toFixed(1)} ml`;
            resSub = "Total";
        }
        return { main: resMain, sub: resSub };
    }

    function render() {
        const container = document.getElementById('medList');
        container.innerHTML = '';
        if (activeWeight <= 0) return;

        const filtered = medications.filter(m => currentFilter === 'all' || m.cat === currentFilter);

        filtered.forEach(m => {
            const res = calculateResult(m);
            const card = document.createElement('div');
            card.className = `med-card cat-${m.cat}`;
            card.onclick = () => openModal(m); 
            card.innerHTML = `
                <div>
                    <div class="med-name">${m.name}</div>
                    <div style="font-size:0.7rem; color:var(--accent); font-weight:bold">${m.dose} ${m.unit}</div>
                </div>
                <div>
                    <span class="res-main">${res.main}</span>
                    <span class="res-sub">${res.sub}</span>
                </div>`;
            container.appendChild(card);
        });
    }

    function openModal(m) {
        document.getElementById('modalTitle').innerText = m.name;
        document.getElementById('protoAmpoule').innerText = m.ampoule || "Non renseigné";
        document.getElementById('protoDilution').innerText = m.dilution || "Non renseigné";
        document.getElementById('protoDebit').innerText = m.debit || "Non renseigné";
        document.getElementById('protoInfos').innerText = m.infos || "Non renseigné";

        const calcFlowArea = document.getElementById('calcFlowArea');
        if (m.type.includes('perf')) {
            const res = calculateResult(m);
            document.getElementById('protoCalcFlow').innerText = res.main.replace(' ml/h', '');
            calcFlowArea.style.display = "block";
        } else {
            calcFlowArea.style.display = "none";
        }

        document.getElementById('protoModal').style.display = "block";
    }

    function closeModal() { document.getElementById('protoModal').style.display = "none"; }
    window.onclick = function(e) { if (e.target == document.getElementById('protoModal')) closeModal(); }
</script>
</body>
</html>
